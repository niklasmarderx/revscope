spring.application.name=revscope-backend
server.port=8080

# Uploaded binaries can be a few MB.
spring.servlet.multipart.max-file-size=64MB
spring.servlet.multipart.max-request-size=64MB

# Point this at a built Ghidra installation to use the real headless analyzer.
# When unset, revscope uses a built-in sample backend so the app runs out of the box.
# ghidra.home=/opt/ghidra
# ghidra.script-path=ghidra-scripts/ExportAnalysis.java
